# This file focues on visual settings

monitor=, 1920x1080@100, 0x0, 1

general {
    gaps_in = 3
    gaps_out = 6 
    border_size = 2
    
    col.active_border = rgb(ffffff)
    col.inactive_border = rgba(555555ff)
}

decoration {
    rounding = 1

    fullscreen_opacity = 1
    inactive_opacity = 0.8
    active_opacity = 0.9

    blur:size = 8
    blur:noise = 0.1

    shadow:color = 0xee000000
    shadow:range = 1
    shadow:render_power = 0
}

animations {
    animation = global, 1, 3, default
}

misc{
    disable_splash_rendering = true # Remove splashes
    disable_hyprland_logo = true # Remove hyprland logo
    force_default_wallpaper = 1 # Remove anime wallpaper
}
