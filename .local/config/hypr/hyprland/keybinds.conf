# This config file focuses on keybinds

# General keybinds
bind = SUPER, RETURN, exec, applauncher # App launcher [important key - important function]
bind = SUPER, SPACE, exec, alacritty # Terminal [important key - important function]
bind = SUPER, B, exec, brave # Web [B]rowser
bind = SUPER, E, exec, alacritty -e lf # File manager [windows shortcut]
bind = SUPER, period, exec, emojimenu # Emojis [windows shortcut]
bind = SUPER, Q, killactive, # Closing a window [[q]uit]
bind = SUPER, P, exec, powermenu # [P]owermenu
bind = SUPER, S, exec, screenshot # [S]creenshot
bind = SUPER, N, exec, networkmenu # [N]etworks menu
bind = SUPER, M, exec, memorymenu # [N]etworks menu
# bind = SUPER, C, exec, calculator # [N]etworks menu

# Window management
bind = SUPER, F, fullscreen, # Make window [f]ullscreen
bind = SUPER, V, togglefloating, # Make window floating [v is under and sounds similar to f]
bind = SUPER, R, exec, refresh # [R]efresh the autostarting applications

# Media control
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Moving focus
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d
bind = SUPER, U, workspace, -1
bind = SUPER, I, workspace, +1
bind = SUPER, O, cyclenext, floating

# Moving windows
bind = SUPER ALT, H, movewindow, l
bind = SUPER ALT, L, movewindow, r
bind = SUPER ALT, K, movewindow, u
bind = SUPER ALT, J, movewindow, d
bind = SUPER ALT, U, movetoworkspace, -1
bind = SUPER ALT, I, movetoworkspace, +1
bind = SUPER ALT, O, centerwindow # Center a floating window
bindm = SUPER, mouse:272, movewindow # Move a window with the mouse

# Resizing windows
bind = SUPER SHIFT, H, resizeactive, -200 0
bind = SUPER SHIFT, L, resizeactive, 200 0
bind = SUPER SHIFT, K, resizeactive, 0 -200
bind = SUPER SHIFT, J, resizeactive, 0 200
bind = SUPER SHIFT, O, exec
bindm = SUPER, mouse:273, resizewindow # Resize a window with a mouse
